<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── SEO & Social ─────────────────────────────────────────── -->
    <meta name="description" content="{{DESCRIPTION}}" />
    {{KEYWORDS}}
    <meta name="author" content="{{AUTHOR}}" />
    <meta name="robots" content="{{ROBOTS}}" />
    <meta name="theme-color" content="#121212" />

    <!-- Canonical URL -->
    <link rel="canonical" href="{{BASE_URL}}{{CANONICAL}}" />

    <!-- Open Graph -->
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:type" content="{{OG_TYPE}}" />
    <meta property="og:site_name" content="SQL Visualizer" />
    {{OG_IMAGE}}
    <meta property="og:url" content="{{BASE_URL}}{{CANONICAL}}" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="{{TWITTER_CARD}}" />
    <!-- Uncomment when Twitter account @Y_SQLVIZ is created and claimed:
    <meta name="twitter:site" content="@Y_SQLVIZ" />
    <meta name="twitter:creator" content="@Y_SQLVIZ" />
    -->
    <meta name="twitter:title" content="{{TWITTER_TITLE}}" />
    <meta name="twitter:description" content="{{TWITTER_DESCRIPTION}}" />
    {{TWITTER_IMAGE}}

    <!-- Profile -->
    {{PROFILE_LINK}}

    <!-- Structured Data (JSON-LD) -->
    {{JSONLD}}

    <!-- Content Security Policy -->
    {{CSP}}

    <title>{{TITLE}}</title>

    <!-- ─── Favicon ───────────────────────────────── -->
    <link rel="icon" type="image/png" href="/Assets/Favicon/SQL Visualizer Logo.png" />
    <link rel="apple-touch-icon" href="/Assets/Favicon/SQL Visualizer Logo.png" />

    <!-- Font Awesome - blocking for icon visibility -->
    <link rel="stylesheet" href="/Assets/fonts/css/all.min.css" />
    <noscript>
      <link rel="stylesheet" href="/Assets/fonts/css/all.min.css" />
    </noscript>

    <!-- Global Navigation & Menu Styles - defer for render blocking -->
    <link rel="stylesheet" href="/global/nav.css" media="print" />
    <noscript>
      <link rel="stylesheet" href="/global/nav.css" />
    </noscript>
    <link rel="stylesheet" href="/Assets/fx/menu-toggle.css" media="print" />
    <noscript>
      <link rel="stylesheet" href="/Assets/fx/menu-toggle.css" />
    </noscript>

    <!-- ─── Google Fonts ─────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" media="print" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
    </noscript>

    <!-- ─── Page-specific CSS ─────────────────────────── -->
    {{CSS_IMPORTS}}

    <!-- Preconnect to self for faster local asset loading -->
    <link rel="preconnect" href="." />

    <!-- Preload critical JS modules -->
    <link rel="modulepreload" href="/js/core/state.js" />
    <link rel="modulepreload" href="/js/core/utils.js" />
    <link rel="modulepreload" href="/js/core/limits.js" />
    <link rel="modulepreload" href="/js/core/url-state.js" />
    <link rel="modulepreload" href="/js/engines/joinEngine.js" />
    <link rel="modulepreload" href="/js/core/hash.js" />

    <!-- ==== Scripts ==== -->
    <!-- <script src="/Assets/Favicon/icon-ani.js" defer></script> -->
    <script src="/global/nav-footer-loader.js" defer></script>
    <script src="/Assets/fx/menu-toggle.js" defer></script>
    {{SCRIPTS}}
  </head>
  <body{{BODY_CLASS}}>
    {{LOADER}}
    {{BODY_CONTENT}}
  </body>
</html>
